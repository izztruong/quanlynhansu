services:
  postgres:
    image: postgres:16-alpine
    container_name: hrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: hrm
      POSTGRES_DB: hrm_db
    ports:
      - "5433:5432"
    volumes:
      - hrm_postgres_data:/var/lib/postgresql/data

volumes:
  hrm_postgres_data:
